[workspace]
resolver = "2"
members = [
    "shared",
    "encryption",
    "watermark",
    "pqcrypto",
    "ledger",
    "integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Confidential Document Security Architecture Team"]
license = "Apache-2.0"
repository = "https://github.com/organization/cryptographic-attribution"
description = "Offline air-gapped confidential document distribution with post-quantum immutable decryption provenance"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
shared = { path = "./shared" }
